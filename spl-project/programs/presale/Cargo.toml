[package]
name = "presale"
version = "0.1.0"
description = "Presale contract for token sales"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "presale"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.0"
anchor-spl = "0.31.0"

[patch.crates-io]
zeroize = "1.8.1"
